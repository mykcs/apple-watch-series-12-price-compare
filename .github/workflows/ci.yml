name: Repository CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-compare-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Price and route validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run dependency-free site validator
        run: python3 scripts/validate_site.py
